# Tests on macOS and Windows for every push and pull request; app bundles for pushes to main
# and version tags. A tag push (v*) attaches the bundles to that tag's GitHub release; to
# (re)build an existing release, run the workflow by hand with its tag.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach bundles to (e.g. v0.2.0); empty = just build"
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run
      - run: cargo clippy --all-targets -- -D warnings
      - run: node --check static/app.js && node --check static/settings.js
        shell: bash

  bundle:
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: write # upload to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # One app for Apple silicon and Intel Macs.
            target: universal-apple-darwin
            rustup: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
            files: bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustup: x86_64-pc-windows-msvc
            bundles: nsis,msi
            files: bundle/nsis/*.exe bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustup }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the bundles
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: jiraf-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/*/*.*
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        working-directory: target/${{ matrix.target }}/release
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber
