[package]
name = "jiraf"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"   # let-chains
description = "A lean, stateless follow-up dashboard over Jira Data Center Plans"
license = "MIT"
repository = "https://github.com/dmbuil/jiraf"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15.7"
env_logger = "0.11.11"
futures-util = "0.3.34"
log = "0.4.34"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1.53.3", features = ["fs", "macros", "rt-multi-thread", "sync"] }
toml = "1.1.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.3", features = ["net", "io-util"] }
