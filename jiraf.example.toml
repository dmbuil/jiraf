# jiraf configuration example. Copy to jiraf.toml (git-ignored) and adapt.
# Secrets live in .env (JIRA_TOKEN), never here.

[server]
icon_dir = "icons"        # local copies of Jira icons (disposable cache), relative to this folder
# bind = "…"              # no longer used: the app opens no port (still accepted, ignored)

[jira]
url = "https://jira.example.com"
cache_seconds = 60        # in-memory only; the ↻ button bypasses it

# Custom field ids on your Jira instance: GET /rest/api/2/field lists them.
[fields]
extended_status  = "customfield_10001"   # single-line text: the follow-up note
activity_type    = "customfield_10002"   # single-select "Activity Type": decides the tab
parent_link      = "customfield_10003"   # Advanced Roadmaps "Parent Link"
epic_link        = "customfield_10004"   # "Epic Link"
target_start     = "customfield_10005"   # Advanced Roadmaps "Target start"
target_end       = "customfield_10006"   # Advanced Roadmaps "Target end"

[follow_up]
stale_days = 30           # Extended Status older than this = "no update"
done_days = 14            # closed issues stay visible this long
ext_max_len = 255
hierarchy = ["Initiative", "Epic", "Task", "Sub-task"]
initiative_type = "Initiative"
priority_order = ["Blocker", "Critical", "Major", "Medium", "Minor", "Low", "Trivial"]

# Tree tabs (shown in this order), split by the "Activity Type" field.
# The top-most Activity Type in an item's line wins (usually its Initiative's), so a whole tree stays
# in one tab. A tab takes the items whose Activity Type is listed in its activity_types (whole values,
# case and accents ignored; several values can share a tab). Items with no Activity Type anywhere up
# the tree go to the tab with include_unset = true. issues = [keys] pins issues (and their
# descendants) to a tab and wins over everything. Anything else lands in an "Other" tab.
[[tabs]]
id = "road"
name = "Roadmap"
activity_types = ["New Roadmap"]
include_unset = true

[[tabs]]
id = "sus"
name = "Sust. & Support"
activity_types = ["Sustainability"]
# issues = ["ABC-123"]

[[tabs]]
id = "evo"
name = "Tech. Evol."
activity_types = ["Technology Evolution"]

# Bubbles in the top bar: any JQL (ORDER BY is ignored). Open issues plus those closed in the last
# `done_days` are fetched. icon_project borrows a Jira project's avatar. exclude = ["id", …] subtracts
# other bubbles: (jql) AND NOT (their jql).
[[bubbles]]
id = "alpha"
name = "Alpha"
jql = "project = ALPHA"
icon_project = "ALPHA"

# Everything in BETA except what the "beta-core" bubble below takes.
[[bubbles]]
id = "beta"
name = "Beta"
jql = "project = BETA"
exclude = ["beta-core"]
icon_project = "BETA"

# Initiatives with a label plus everything beneath them (needs ScriptRunner), one clause per hop:
# the Initiatives, their Sub-tasks, Parent Link children, those children's Sub-tasks, Epic Link
# children, and their Sub-tasks. Use a literal string (''') so the \" in the last line survives.
[[bubbles]]
id = "beta-core"
name = "Beta Core"
icon_project = "BETA"
jql = '''
(project = BETA AND issuetype = Initiative AND labels = Core)
OR issueFunction in subtasksOf("project = BETA AND issuetype = Initiative AND labels = Core")
OR issueFunction in portfolioChildrenOf("project = BETA AND issuetype = Initiative AND labels = Core")
OR issueFunction in subtasksOf("issueFunction in portfolioChildrenOf('project = BETA AND issuetype = Initiative AND labels = Core')")
OR issueFunction in issuesInEpics("issueFunction in portfolioChildrenOf('project = BETA AND issuetype = Initiative AND labels = Core')")
OR issueFunction in subtasksOf("issueFunction in issuesInEpics('issueFunction in portfolioChildrenOf(\"project = BETA AND issuetype = Initiative AND labels = Core\")')")
'''
